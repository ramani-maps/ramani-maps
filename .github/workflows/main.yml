name: Build and Test

on:
  push:
    branches:
    - 'main'
  pull_request:
    branches:
    - '*'
  release:
    types: [created]

jobs:
  build-maplibre-ios:
    name: Build maplibre-native (iOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Compute cache key
        id: key
        run: |
          h=$(shasum -a 256 \
                .maplibre-native-version \
                maplibre-native-ios.patch \
                build-maplibre-ios.sh \
                internalize-libmaplibre.sh \
              | shasum -a 256 | cut -d' ' -f1)
          echo "key=maplibre-ios-$(uname -m)-$h" >> "$GITHUB_OUTPUT"

      - name: Restore archives
        id: archives
        uses: actions/cache@v5
        with:
          path: |
            ramani-maplibre/libs/iosArm64/libMapLibre.a
            ramani-maplibre/libs/iosSimulatorArm64/libMapLibre.a
            ramani-maplibre/libs/include/MapLibre
            ramani-maplibre/src/iosMain/composeResources/files
          key: ${{ steps.key.outputs.key }}

      - name: Build
        if: steps.archives.outputs.cache-hit != 'true'
        run: ./build-maplibre-ios.sh

  ramani-maplibre-compile-ios:
    name: Compile ramani-maplibre (iOS)
    needs: [build-maplibre-ios]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Compute cache key
        id: key
        run: |
          h=$(shasum -a 256 \
                .maplibre-native-version \
                maplibre-native-ios.patch \
                build-maplibre-ios.sh \
                internalize-libmaplibre.sh \
              | shasum -a 256 | cut -d' ' -f1)
          echo "key=maplibre-ios-$(uname -m)-$h" >> "$GITHUB_OUTPUT"
      - name: Restore archives
        uses: actions/cache@v5
        with:
          path: |
            ramani-maplibre/libs/iosArm64/libMapLibre.a
            ramani-maplibre/libs/iosSimulatorArm64/libMapLibre.a
            ramani-maplibre/libs/include/MapLibre
            ramani-maplibre/src/iosMain/composeResources/files
          key: ${{ steps.key.outputs.key }}
      - name: Compile and link iOS targets
        working-directory: ./ramani-maplibre
        run: ./gradlew compileKotlinIosArm64 compileKotlinIosSimulatorArm64 linkDebugTestIosSimulatorArm64

  ramani-maplibre-android:
    name: Build and test ramani-maplibre (Android)
    runs-on: ubuntu-24.04
    env:
      ANDROID_AVD_HOME: ${{ github.workspace }}/.android/avd
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build
        working-directory: ./ramani-maplibre
        run: ./gradlew build
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm",GROUP="kvm",MODE="0666",OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Create emulator AVD (latest available x86_64 API)
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager"
          mkdir -p "$ANDROID_AVD_HOME"
          LATEST_API=$("$SDKMANAGER" --list \
            | grep -Eo 'system-images;android-[0-9]+;google_apis;x86_64' \
            | sed 's/^system-images;android-//;s/;google_apis;x86_64$//' \
            | sort -n \
            | tail -1)
          if [ -z "$LATEST_API" ]; then
            echo "No Android x86_64 system image package is available on this runner."
            exit 1
          fi
          SYSTEM_IMAGE="system-images;android-${LATEST_API};google_apis;x86_64"
          echo "Using Android API ${LATEST_API} (${SYSTEM_IMAGE})"
          yes 2>/dev/null | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "emulator" "platforms;android-${LATEST_API}" "$SYSTEM_IMAGE"
          echo "no" | "$AVDMANAGER" create avd -n test_avd_latest -k "$SYSTEM_IMAGE" --device "pixel_5" -p "$ANDROID_AVD_HOME/test_avd_latest" --force
          "$ANDROID_SDK_ROOT/emulator/emulator" -list-avds | grep -Fx "test_avd_latest"
      - name: Print github values
        run: echo "github.event_name=${{ github.event_name }}, github.event.action=${{ github.event.action }}, github.ref_name=${{ github.ref_name }}"
      - name: Start emulator
        id: start_emulator
        run: |
          "$ANDROID_SDK_ROOT/emulator/emulator" -avd test_avd_latest -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect &
          "$ANDROID_SDK_ROOT/platform-tools/adb" wait-for-device
          "$ANDROID_SDK_ROOT/platform-tools/adb" shell 'while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 1; done'
          echo "Emulator ready"
      - name: Run connected device tests
        working-directory: ./ramani-maplibre
        run: ./gradlew connectedAndroidDeviceTest
      - name: Stop emulator
        if: ${{ always() && steps.start_emulator.outcome != 'skipped' }}
        run: |
          "$ANDROID_SDK_ROOT/platform-tools/adb" emu kill

  ramani-maplibre-pr-artifact:
    name: Build ramani-maplibre artifacts (PR)
    needs: [build-maplibre-ios]
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Compute cache key
        id: key
        run: |
          h=$(shasum -a 256 \
                .maplibre-native-version \
                maplibre-native-ios.patch \
                build-maplibre-ios.sh \
                internalize-libmaplibre.sh \
              | shasum -a 256 | cut -d' ' -f1)
          echo "key=maplibre-ios-$(uname -m)-$h" >> "$GITHUB_OUTPUT"
      - name: Restore archives
        uses: actions/cache@v5
        with:
          path: |
            ramani-maplibre/libs/iosArm64/libMapLibre.a
            ramani-maplibre/libs/iosSimulatorArm64/libMapLibre.a
            ramani-maplibre/libs/include/MapLibre
            ramani-maplibre/src/iosMain/composeResources/files
          key: ${{ steps.key.outputs.key }}
      - name: Publish to local Maven repo
        working-directory: ./ramani-maplibre
        run: ./gradlew publishToMavenLocal --no-configuration-cache
      - name: Collect artifacts
        run: |
          mkdir -p pr-artifacts/org
          cp -R ~/.m2/repository/org/ramani-maps pr-artifacts/org/
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ramani-maplibre-pr-${{ github.event.pull_request.number }}-${{ github.sha }}
          path: pr-artifacts
          retention-days: 14

  ramani-maplibre-publish-release:
    name: Publish ramani-maplibre release (KMP)
    needs: [build-maplibre-ios, ramani-maplibre-compile-ios, ramani-maplibre-android]
    if: ${{ github.event_name == 'release' && github.event.action == 'created' && startsWith(github.ref_name, 'maplibre-') }}
    runs-on: macos-26
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}
    steps:
      # The tag encodes the version: maplibre-x.y.z or maplibre-x.y.z-SNAPSHOT.
      - name: Extract version from tag
        id: version
        run: |
          tag_name="${{ github.ref_name }}"
          version="${tag_name#maplibre-}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-SNAPSHOT)?$ ]]; then
            echo "ERROR: tag '$tag_name' is invalid, expected maplibre-x.y.z or maplibre-x.y.z-SNAPSHOT"
            exit 1
          fi
          echo "Publishing version ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Compute cache key
        id: key
        run: |
          h=$(shasum -a 256 \
                .maplibre-native-version \
                maplibre-native-ios.patch \
                build-maplibre-ios.sh \
                internalize-libmaplibre.sh \
              | shasum -a 256 | cut -d' ' -f1)
          echo "key=maplibre-ios-$(uname -m)-$h" >> "$GITHUB_OUTPUT"

      - name: Restore archives
        uses: actions/cache@v5
        with:
          path: |
            ramani-maplibre/libs/iosArm64/libMapLibre.a
            ramani-maplibre/libs/iosSimulatorArm64/libMapLibre.a
            ramani-maplibre/libs/include/MapLibre
            ramani-maplibre/src/iosMain/composeResources/files
          key: ${{ steps.key.outputs.key }}

      # For a -SNAPSHOT version the plugin uploads to the snapshot repository and
      # the release part is a no-op, so the same task works for both cases.
      - name: Publish to Maven Central
        working-directory: ./ramani-maplibre
        run: ./gradlew publishAndReleaseToMavenCentral -PVERSION=${{ steps.version.outputs.version }} --no-configuration-cache

  ramani-maplibre-publish-snapshot:
    name: Publish ramani-maplibre snapshot (KMP)
    needs: [build-maplibre-ios, ramani-maplibre-compile-ios, ramani-maplibre-android]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: macos-26
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # No -PVERSION here: pushes to main publish the fallback version declared
      # in build.gradle.kts, and only if it is a snapshot.
      - name: Check version is a snapshot
        id: check
        run: |
          if grep -qE '^val fallbackVersion = ".*-SNAPSHOT"' ramani-maplibre/build.gradle.kts; then
            echo "is-snapshot=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-snapshot=false" >> "$GITHUB_OUTPUT"
            echo "version is not a -SNAPSHOT, skipping snapshot publish"
          fi

      - name: Set up JDK 21
        if: steps.check.outputs.is-snapshot == 'true'
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Compute cache key
        if: steps.check.outputs.is-snapshot == 'true'
        id: key
        run: |
          h=$(shasum -a 256 \
                .maplibre-native-version \
                maplibre-native-ios.patch \
                build-maplibre-ios.sh \
                internalize-libmaplibre.sh \
              | shasum -a 256 | cut -d' ' -f1)
          echo "key=maplibre-ios-$(uname -m)-$h" >> "$GITHUB_OUTPUT"

      - name: Restore archives
        if: steps.check.outputs.is-snapshot == 'true'
        uses: actions/cache@v5
        with:
          path: |
            ramani-maplibre/libs/iosArm64/libMapLibre.a
            ramani-maplibre/libs/iosSimulatorArm64/libMapLibre.a
            ramani-maplibre/libs/include/MapLibre
            ramani-maplibre/src/iosMain/composeResources/files
          key: ${{ steps.key.outputs.key }}

      - name: Publish snapshot to Maven Central
        if: steps.check.outputs.is-snapshot == 'true'
        working-directory: ./ramani-maplibre
        run: ./gradlew publishToMavenCentral --no-configuration-cache

  example:
    name: "Build and test example"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Use ramani as composite build
        working-directory: ./example
        run: echo "includeBuild(\"../ramani-maplibre\")" >> settings.gradle.kts
      - name: Build
        working-directory: ./example
        run: |
            ./gradlew build

  example-ios:
    name: "Build example (iOS)"
    needs: [build-maplibre-ios]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Compute cache key
        id: key
        run: |
          h=$(shasum -a 256 \
                .maplibre-native-version \
                maplibre-native-ios.patch \
                build-maplibre-ios.sh \
                internalize-libmaplibre.sh \
              | shasum -a 256 | cut -d' ' -f1)
          echo "key=maplibre-ios-$(uname -m)-$h" >> "$GITHUB_OUTPUT"
      - name: Restore archives
        uses: actions/cache@v5
        with:
          path: |
            ramani-maplibre/libs/iosArm64/libMapLibre.a
            ramani-maplibre/libs/iosSimulatorArm64/libMapLibre.a
            ramani-maplibre/libs/include/MapLibre
            ramani-maplibre/src/iosMain/composeResources/files
          key: ${{ steps.key.outputs.key }}
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ./example/iosApp
        run: xcodegen generate
      - name: Use ramani as composite build
        working-directory: ./example
        run: echo "includeBuild(\"../ramani-maplibre\")" >> settings.gradle.kts
      # Simulator build with signing disabled: verifies the app compiles and
      # links without needing an Apple account, signing key or DEVELOPMENT_TEAM.
      - name: Build iOS example (simulator, unsigned)
        working-directory: ./example/iosApp
        run: |
          xcodebuild \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
